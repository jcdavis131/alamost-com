  <g clip-path="url(#card)" fill="#B4472B">
    <polygon points="10,25.5 9.4,5 12.1,5" opacity="0.9" />
    <polygon points="10,25.5 14.2,5 15.9,5" opacity="0.62" />
    <polygon points="10,25.5 18.6,5.4 20.8,6.8" opacity="0.4" />
