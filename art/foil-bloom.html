<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foil Bloom — Lina's Card Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Foil Bloom</h1>
            <div class="subtitle">
                One armature, unchanging. Only the light varies — and the light is what
                people are buying. The house pattern of Lina's Card Shop.
            </div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Ray Count</label>
                    <div class="slider-container">
                        <input type="range" id="rayCount" min="8" max="220" step="2" value="64" oninput="updateParam('rayCount', this.value)">
                        <span class="value-display" id="rayCount-value">64</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Angular Drift</label>
                    <div class="slider-container">
                        <input type="range" id="angularDrift" min="0" max="3" step="0.05" value="0.7" oninput="updateParam('angularDrift', this.value)">
                        <span class="value-display" id="angularDrift-value">0.7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Hue Arc</label>
                    <div class="slider-container">
                        <input type="range" id="hueArc" min="4" max="180" step="1" value="52" oninput="updateParam('hueArc', this.value)">
                        <span class="value-display" id="hueArc-value">52</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Hue Origin</label>
                    <div class="slider-container">
                        <input type="range" id="hueOrigin" min="0" max="359" step="1" value="34" oninput="updateParam('hueOrigin', this.value)">
                        <span class="value-display" id="hueOrigin-value">34</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Falloff</label>
                    <div class="slider-container">
                        <input type="range" id="falloff" min="0.6" max="4" step="0.05" value="2.2" oninput="updateParam('falloff', this.value)">
                        <span class="value-display" id="falloff-value">2.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Lattice Arcs</label>
                    <div class="slider-container">
                        <input type="range" id="latticeCount" min="0" max="60" step="1" value="22" oninput="updateParam('latticeCount', this.value)">
                        <span class="value-display" id="latticeCount-value">22</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pivot Bias</label>
                    <div class="slider-container">
                        <input type="range" id="pivotBias" min="0.02" max="0.6" step="0.01" value="0.3" oninput="updateParam('pivotBias', this.value)">
                        <span class="value-display" id="pivotBias-value">0.3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grain</label>
                    <div class="slider-container">
                        <input type="range" id="grain" min="0" max="40" step="1" value="13" oninput="updateParam('grain', this.value)">
                        <span class="value-display" id="grain-value">13</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Paper</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#fcfbf9" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#fcfbf9</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Lattice</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#d8cfc0" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#d8cfc0</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row" style="margin-top: 8px;">
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // FOIL BLOOM — PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            rayCount: 64,
            angularDrift: 0.7,
            hueArc: 52,
            hueOrigin: 34,
            falloff: 2.2,
            latticeCount: 22,
            pivotBias: 0.3,
            grain: 13,
            colorPalette: ['#fcfbf9', '#d8cfc0']
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // THE ALGORITHM
        //
        // Radial refraction from an off-centre pivot. Rays are spaced by a
        // seeded noise walk rather than evenly, so the fan crowds into bright
        // thickets and opens into quiet plains. Over it lies an interference
        // lattice on an irrational progression, never aligning with the rays.
        // The system resolves and stops — a card does not shimmer on its own.
        // ═══════════════════════════════════════════════════════════════════════

        const W = 1200, H = 1500;

        let pivot, phase, rays, lattice, resolved;

        function setup() {
            const canvas = createCanvas(W, H);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            const loading = document.querySelector('.loading');
            if (loading) loading.style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Never centred. A centred light source is a diagram.
            const dir = random(TWO_PI);
            pivot = {
                x: W / 2 + cos(dir) * W * params.pivotBias,
                y: H / 2 + sin(dir) * H * params.pivotBias
            };

            // Three seeded octaves, periodic over a full turn so the fan closes
            // on itself without a visible seam.
            phase = [random(TWO_PI), random(TWO_PI), random(TWO_PI)];

            rays = [];
            const n = Math.round(params.rayCount);
            for (let i = 0; i < n; i++) {
                const t = i / n;
                const w = walk(t);
                const centre = (t + (w * params.angularDrift) / n) * TWO_PI;
                const width = (TWO_PI / n) * (0.28 + abs(w) * 0.5);
                rays.push({
                    a0: centre - width / 2,
                    a1: centre + width / 2,
                    hue: params.hueOrigin + w * params.hueArc * 0.5,
                    alpha: 0.10 + abs(w) * 0.22
                });
            }

            // Irrational progression — never aligns, never repeats.
            lattice = [];
            const phi = 1.6180339887;
            let r = 60 + random(50);
            while (lattice.length < params.latticeCount && r < 1900) {
                lattice.push(r);
                r *= 1 + 0.155 * phi * (0.85 + random(0.3));
            }

            resolved = false;
            loop();
        }

        /** The noise walk that governs angular density — the load-bearing curve. */
        function walk(t) {
            return sin(t * 2 * PI + phase[0]) * 0.5
                 + sin(t * 6 * PI + phase[1]) * 0.3
                 + sin(t * 11 * PI + phase[2]) * 0.2;
        }

        function draw() {
            if (resolved) return;

            const paper = color(params.colorPalette[0]);
            background(paper);

            // ── The refraction fan ──────────────────────────────────────────
            noStroke();
            colorMode(HSB, 360, 100, 100, 1);
            const R = max(W, H) * 1.6;
            for (const ray of rays) {
                const h = ((ray.hue % 360) + 360) % 360;
                fill(h, 62, 84, ray.alpha);
                triangle(
                    pivot.x, pivot.y,
                    pivot.x + cos(ray.a0) * R, pivot.y + sin(ray.a0) * R,
                    pivot.x + cos(ray.a1) * R, pivot.y + sin(ray.a1) * R
                );
            }
            colorMode(RGB, 255);

            // ── The interference lattice ────────────────────────────────────
            // Individually imperceptible. Collectively, surface.
            noFill();
            const lat = color(params.colorPalette[1]);
            lat.setAlpha(90);
            stroke(lat);
            strokeWeight(3);
            for (const r of lattice) circle(pivot.x, pivot.y, r * 2);

            // ── Falloff ─────────────────────────────────────────────────────
            // Saturation cools from pivot to perimeter. This curve is the
            // difference between something printed and a screenshot of maths.
            drawFalloff(paper);

            // ── Grain: paper tooth, the last one percent ────────────────────
            if (params.grain > 0) drawGrain();

            resolved = true;
            noLoop();
        }

        function drawFalloff(paper) {
            // A real radial gradient, not stacked discs. Concentric filled
            // circles accumulate inward — the largest one covers everything
            // beneath it — which produces the exact opposite of a falloff.
            const ctx = drawingContext;
            const maxR = dist(0, 0, W, H);
            const rgb = `${round(red(paper))},${round(green(paper))},${round(blue(paper))}`;
            const g = ctx.createRadialGradient(pivot.x, pivot.y, 0, pivot.x, pivot.y, maxR);
            const stops = 28;
            for (let i = 0; i <= stops; i++) {
                const t = i / stops;
                g.addColorStop(t, `rgba(${rgb},${(pow(t, params.falloff) * 0.92).toFixed(4)})`);
            }
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
        }

        function drawGrain() {
            // Own PRNG pass, still seeded — grain must be reproducible too.
            randomSeed(params.seed ^ 0x5f3759df);
            loadPixels();
            const d = pixelDensity();
            const amp = params.grain;
            for (let i = 0; i < pixels.length; i += 4) {
                const n = (random() - 0.5) * amp;
                pixels[i]     = constrain(pixels[i]     + n, 0, 255);
                pixels[i + 1] = constrain(pixels[i + 1] + n, 0, 255);
                pixels[i + 2] = constrain(pixels[i + 2] + n, 0, 255);
            }
            updatePixels();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            const display = document.getElementById(name + '-value');
            if (display) display.textContent = value;
            initializeSystem();
        }

        function updateColor(id, value) {
            const index = id === 'color1' ? 0 : 1;
            params.colorPalette[index] = value;
            document.getElementById(id + '-value').textContent = value;
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('foil-bloom-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams, colorPalette: [...defaultParams.colorPalette]};

            for (const key of ['rayCount', 'angularDrift', 'hueArc', 'hueOrigin',
                               'falloff', 'latticeCount', 'pivotBias', 'grain']) {
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = params[key];
            }
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
